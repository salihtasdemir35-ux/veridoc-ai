name: APK oluştur

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip dosyasını aç
        run: |
          if [ ! -f package.json ]; then
            ZIP=$(ls *.zip | head -n 1)
            unzip -q -o "$ZIP" -d /tmp/proje
            PJ=$(find /tmp/proje -name package.json | head -n 1)
            cp -a "$(dirname "$PJ")"/. .
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: APK derle
        run: bash scripts/ci-build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: VeriDoc-AI-APK
          path: VeriDoc-AI.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: VeriDoc AI v1.1.${{ github.run_number }}
          files: VeriDoc-AI.apk
