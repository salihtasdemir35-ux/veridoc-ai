name: APK oluştur

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Zip dosyasını aç (zip olarak yüklendiyse)
        run: |
          if [ ! -f package.json ]; then
            if [ -f veridoc-ai.zip ]; then ZIP=veridoc-ai.zip; else ZIP=$(ls *.zip 2>/dev/null | head -n 1); fi
            if [ -z "$ZIP" ]; then echo "Depoda ne package.json ne de zip dosyası var."; exit 1; fi
            echo "Açılıyor: $ZIP"
            mkdir -p /tmp/proje
            unzip -q -o "$ZIP" -d /tmp/proje
            PJ=$(find /tmp/proje -name package.json -not -path '*/node_modules/*' | head -n 1)
            if [ -z "$PJ" ]; then echo "Zip içinde package.json bulunamadı."; exit 1; fi
            cp -a "$(dirname "$PJ")"/. .
          fi
          ls -la

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Analiz motoru testleri
        run: |
          if [ -f tests/test_analyzer.js ]; then node tests/test_analyzer.js; else echo "Test dosyası yok, atlandı."; fi

      - name: Paketleri yükle
        run: npm install

      - name: Android projesini oluştur
        run: |
          rm -rf android
          npx cap add android
          npx capacitor-assets generate --andr
